<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王烨的自我介绍</title>
    <link rel= "stylesheet" href="./basic.css">
</head>
<body>

    <!-- 1. 标题 -->
    <h2 class="title-demo">1. 标题</h2>
    <h1>我是王烨</h1>
    <h2>一名前端初学者</h2>
    <h3>喜欢打游戏、看电影、看书</h3>

    <!-- 2. 段落 -->
    <h2 class="title-demo">2. 段落</h2>
    <p class="text-cont">
        大家好，我叫<em>王烨</em>，正在学习<strong>HTML和CSS</strong>。<br>
        我的目标是<u>做出好看的网页</u>。<s>以前觉得代码很难</s>，现在发现挺有趣的。
    </p>

    <hr>

    <!-- 3. 超链接和图片 -->
    <h2 class="title-demo">3. 超链接和图片</h2>
    <a href="http://baidu.com" target="_blank">百度</a>
    <img src="./img/1.jpg" alt="我的头像">

    <!-- 4. 列表 -->
    <h2 class="title-demo">4. 列表</h2>
    <h3>我喜欢做的事情</h3>
    <ul class="list-demo">
        <li>打游戏</li>
        <li>看电影</li>
        <li>看书</li>
    </ul>
    <ol type="A">
        <li>数学</li>
        <li>英语</li>
        <li>语文</li>
    </ol>

    <!-- 5. 表格 -->
    <h2 class="title-demo">5. 表格</h2>
    <table id="user-table" border="2" cellspacing="0" cellpadding="3">
        <caption>王烨的信息表</caption>
        <tr>
            <th>姓名</th>
            <th>年龄</th>

            <th>城市</th>

        <tr>
            <td>王烨</td>
            <td>20</td>

    <button>表单外的按钮</button>
